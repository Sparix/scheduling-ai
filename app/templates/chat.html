<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scheduling assistant</title>
  <link rel="stylesheet" href="/static/styles.css?v=6">
  <script src="/static/app.js?v=6" defer></script>
</head>
<body class="chat-page">
  <div class="app">
    <main class="chat-layout">
      <div class="toolbar">
        <label for="account">Signed in as</label>
        <select id="account"></select>
        <span id="clock" class="muted"></span>
      </div>
      <section id="messages" aria-live="polite"></section>
      <form id="chat-form">
        <div class="composer">
          <input id="message" autocomplete="off" placeholder="Message…" required>
          <button id="send" class="primary" type="submit">Send</button>
        </div>
        <p id="status" class="muted"></p>
      </form>
    </main>
    <aside id="view" class="view" hidden>
      <header class="view-header">
        <div>
          <h2 id="view-title"></h2>
          <p id="view-subtitle" class="muted"></p>
        </div>
        <button id="view-close" type="button" aria-label="Close">×</button>
      </header>
      <div id="view-body"></div>
    </aside>
  </div>
</body>
</html>
